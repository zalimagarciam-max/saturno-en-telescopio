<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saturno en el telescopio</title>
<style>
:root{color-scheme:dark;--brass:#b08d57;--ink:#e9e2d0;--dim:#9b9484;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;color:var(--ink);font-family:Palatino,"Palatino Linotype",Georgia,serif;overflow:hidden}
canvas{position:fixed;inset:0;display:block;cursor:grab;touch-action:none}
canvas:active{cursor:grabbing}
#scope{position:fixed;inset:0;pointer-events:none;z-index:2;
background:radial-gradient(circle at 50% 50%,transparent 0,transparent calc(min(48vw,48vh) - 2px),#1a1510 calc(min(48vw,48vh) + 1px),#000 calc(min(48vw,48vh) + 40px),#000 100%)}
#scope::before{content:"";position:absolute;left:50%;top:50%;width:calc(min(48vw,48vh)*2);height:calc(min(48vw,48vh)*2);transform:translate(-50%,-50%);border-radius:50%;
box-shadow:0 0 0 3px var(--brass),0 0 0 9px #2a2118,0 0 0 11px var(--brass),inset 0 0 90px 30px rgba(0,0,0,.85)}
#scope::after{content:"";position:absolute;left:50%;top:50%;width:calc(min(48vw,48vh)*2);height:calc(min(48vw,48vh)*2);transform:translate(-50%,-50%);border-radius:50%;
background:linear-gradient(rgba(176,141,87,.18),rgba(176,141,87,.18)) center/1px 100% no-repeat,linear-gradient(rgba(176,141,87,.18),rgba(176,141,87,.18)) center/100% 1px no-repeat}
#panel{position:fixed;z-index:5;right:max(18px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);width:min(200px,64vw);
background:rgba(12,10,8,.38);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(176,141,87,.35);border-radius:6px;padding:8px 10px}
#panel h1{font-size:11px;font-weight:400;font-style:italic;color:var(--brass);margin:0 0 4px}
#nav{display:flex;flex-direction:column;gap:2px;border-bottom:1px solid rgba(176,141,87,.3);padding-bottom:6px;margin-bottom:6px}
#nav button{background:none;border:0;color:var(--ink);font:inherit;font-size:14px;text-align:right;padding:2px;cursor:pointer;opacity:.7;transition:opacity .2s,color .2s}
#nav button:hover,#nav button.on{opacity:1;color:#f2c97d}
#nav button:focus-visible{outline:1px solid var(--brass)}
#info h2{margin:0 0 4px;font-size:15px;font-weight:400}
#info p{margin:0 0 5px;font-size:11.5px;line-height:1.4;color:#d8d1bf}
#info ul{margin:0;padding-left:14px;font-size:11px;line-height:1.4;color:#cfc8b5;max-height:22vh;overflow:auto}
#info li{margin-bottom:3px}
#zoom{position:fixed;left:max(18px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));z-index:5;display:flex;gap:8px;align-items:center;color:var(--dim);font-size:13px}
#zoom button{width:34px;height:34px;border-radius:50%;border:1px solid var(--brass);background:rgba(12,10,8,.5);color:var(--ink);font-size:18px;cursor:pointer}
@media(max-width:700px){#panel{top:auto;bottom:62px;transform:none;right:10px}#info ul{max-height:18vh}#nav{flex-direction:row;flex-wrap:wrap;justify-content:space-between}#nav button{font-size:12px}}
</style>
</head>
<body>
<div id="scope"></div>
<aside id="panel">
 <h1>Ocular · elige un objetivo</h1>
 <nav id="nav">
  <button data-k="saturn">Saturno</button>
  <button data-k="rings">Anillos</button>
  <button data-k="titan">Titán</button>
  <button data-k="enc">Encélado</button>
 </nav>
 <div id="info"></div>
</aside>
<div id="zoom"><button id="zi" aria-label="Acercar">+</button><button id="zo" aria-label="Alejar">−</button><span>Arrastra para rotar · rueda para zoom · toca los astros</span></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const DATA={
saturn:{t:"Saturno",p:"El segundo planeta más grande del Sistema Solar: un gigante gaseoso de hidrógeno y helio.",l:[
"Diámetro ecuatorial de unos 120 500 km, 9,5 veces el de la Tierra.","Su densidad es menor que la del agua: en un océano gigante, flotaría.","Un día dura ~10,7 horas; un año, ~29,4 años terrestres.","Vientos de hasta ~1 800 km/h cerca del ecuador.","En su polo norte hay una tormenta con forma de hexágono, de unos 30 000 km de ancho.","Tiene más de 140 lunas confirmadas, más que cualquier otro planeta.","Se ve a simple vista y lo conocen desde la antigüedad; Galileo lo observó en 1610 y vio “orejas” que eran los anillos."]},
rings:{t:"Los anillos",p:"El sistema de anillos más espectacular del Sistema Solar, formado por miles de millones de fragmentos que orbitan el planeta.",l:[
"Están hechos casi por completo de hielo de agua (95–99 %), con algo de roca y polvo.","Los trozos van desde granos de polvo hasta bloques del tamaño de una casa.","Se extienden más de 280 000 km, pero su grosor suele ser de solo ~10 m a 1 km.","Los anillos principales son A, B y C; entre A y B está la División de Cassini, de ~4 800 km, creada por la resonancia con la luna Mimas.","Las lunas pastoras, como Prometeo y Pandora, mantienen delgado el anillo F.","Se pierden material hacia Saturno (“lluvia de anillos”); podrían ser jóvenes, de unos 100–400 millones de años.","Si los juntáramos en una sola luna, sería parecida a una de unos cientos de km de ancho."]},
titan:{t:"Titán",p:"La luna más grande de Saturno y la segunda del Sistema Solar. Es el único mundo con atmósfera densa además de la Tierra… y lagos en superficie.",l:[
"Diámetro de 5 150 km: más grande que Mercurio.","Descubierta por Christiaan Huygens en 1655.","Su atmósfera es ~95 % nitrógeno, con metano; la presión en el suelo es 1,5 veces la terrestre.","Temperatura en superficie: unos −179 °C.","Llueve metano y hay lagos y mares de metano y etano líquidos, como Kraken Mare.","La sonda Huygens aterrizó en 2005: el aterrizaje más lejano jamás logrado.","La misión Dragonfly de la NASA, un dron nuclear, está planeada para llegar en 2034.","Tarda ~16 días en orbitar Saturno y siempre le muestra la misma cara."]},
enc:{t:"Encélado",p:"Una pequeña luna helada con un océano oculto: uno de los mejores lugares para buscar vida fuera de la Tierra.",l:[
"Mide solo ~504 km de diámetro, aprox. la distancia de Madrid a Barcelona.","Descubierta por William Herschel en 1789.","Es de los objetos más brillantes del Sistema Solar: refleja ~99 % de la luz que recibe.","Géiseres en su polo sur lanzan vapor y hielo al espacio.","Esos chorros alimentan el anillo E de Saturno.","La sonda Cassini encontró bajo el hielo un océano global de agua salada.","Detectó hidrógeno molecular y compuestos orgánicos en los chorros.","Orbita Saturno cada ~1,4 días."]}
};
const $=s=>document.querySelector(s);
function show(k){const d=DATA[k];$('#info').innerHTML='<h2>'+d.t+'</h2><p>'+d.p+'</p><ul>'+d.l.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));}

const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);document.body.prepend(R.domElement);
const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.05,2000);

function tex(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);return t;}
const rnd=(a,b)=>a+Math.random()*(b-a);

// Estrellas
const sp=[];for(let i=0;i<2500;i++){const v=new THREE.Vector3().randomDirection?0:0;const u=Math.random()*2-1,a=Math.random()*6.283,r=Math.sqrt(1-u*u),d=rnd(600,900);sp.push(r*Math.cos(a)*d,u*d,r*Math.sin(a)*d);}
const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
S.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:1.6,sizeAttenuation:false})));

// Saturno
const SR=3;
const satTex=tex(512,256,(g,w,h)=>{const cols=['#e3cf9f','#cdb27a','#e9d9ad','#b99b64','#dcc48f','#c7a96f','#efe0b6','#b8975f'];
for(let y=0;y<h;y++){const i=Math.floor(y/h*cols.length*2.2)%cols.length;g.fillStyle=cols[i];g.fillRect(0,y,w,1);}
for(let i=0;i<140;i++){g.fillStyle='rgba('+(Math.random()<.5?'255,240,200':'120,90,50')+','+rnd(.03,.09)+')';g.fillRect(rnd(0,w),rnd(0,h),rnd(30,160),rnd(1,4));}});
const saturn=new THREE.Mesh(new THREE.SphereGeometry(SR,64,48),new THREE.MeshLambertMaterial({map:satTex}));
saturn.rotation.z=.47;S.add(saturn);

// Anillos
const RI=3.9,RO=7.4;
const ringTex=tex(1024,4,(g,w)=>{const stops=[[0,0],[.05,.12],[.16,.3],[.2,.55],[.38,.85],[.5,.95],[.6,.8],[.62,.0],[.66,.0],[.68,.7],[.8,.75],[.9,.6],[.93,.0],[.95,.5],[.97,.0],[1,0]];
for(let x=0;x<w;x++){const p=x/w;let a=0;for(let i=1;i<stops.length;i++){if(p<=stops[i][0]){const q=(p-stops[i-1][0])/(stops[i][0]-stops[i-1][0]||1);a=stops[i-1][1]+(stops[i][1]-stops[i-1][1])*q;break;}}
a*=.82+.18*Math.sin(x*.9)*Math.sin(x*.23);const l=190+60*Math.sin(x*.05);g.fillStyle='rgba('+l+','+(l-25)+','+(l-70)+','+Math.max(0,a)+')';g.fillRect(x,0,1,4);}});
const rg=new THREE.RingGeometry(RI,RO,160,1),pa=rg.attributes.position,uv=rg.attributes.uv;
for(let i=0;i<pa.count;i++){const r=Math.hypot(pa.getX(i),pa.getY(i));uv.setXY(i,(r-RI)/(RO-RI),.5);}
const rings=new THREE.Mesh(rg,new THREE.MeshBasicMaterial({map:ringTex,transparent:true,side:THREE.DoubleSide,depthWrite:false}));
rings.rotation.x=-Math.PI/2;
const tilt=new THREE.Group();tilt.rotation.z=.47;tilt.add(rings);S.add(tilt);
saturn.rotation.z=0;tilt.add(saturn);S.remove(saturn);

// Titán
const titanTex=tex(256,128,(g,w,h)=>{g.fillStyle='#d99a3c';g.fillRect(0,0,w,h);for(let i=0;i<260;i++){g.fillStyle='rgba('+(Math.random()<.5?'120,70,20':'245,190,100')+','+rnd(.05,.18)+')';g.beginPath();g.ellipse(rnd(0,w),rnd(0,h),rnd(6,40),rnd(3,12),0,0,6.3);g.fill();}});
const titan=new THREE.Mesh(new THREE.SphereGeometry(.5,48,32),new THREE.MeshLambertMaterial({map:titanTex}));
const haze=new THREE.Mesh(new THREE.SphereGeometry(.56,48,32),new THREE.MeshBasicMaterial({color:0xf0a840,transparent:true,opacity:.22,side:THREE.BackSide}));
titan.add(haze);titan.add(new THREE.Mesh(new THREE.SphereGeometry(.53,48,32),new THREE.MeshBasicMaterial({color:0xe8a040,transparent:true,opacity:.18})));
S.add(titan);

// Encélado
const encTex=tex(256,128,(g,w,h)=>{g.fillStyle='#f4f8fb';g.fillRect(0,0,w,h);g.strokeStyle='rgba(110,170,215,.55)';g.lineWidth=2;for(let i=0;i<22;i++){g.beginPath();g.moveTo(rnd(0,w),rnd(h*.55,h));g.lineTo(rnd(0,w),h);g.stroke();}
for(let i=0;i<40;i++){g.fillStyle='rgba(150,170,190,.18)';g.beginPath();g.arc(rnd(0,w),rnd(0,h),rnd(2,9),0,6.3);g.fill();}});
const enc=new THREE.Mesh(new THREE.SphereGeometry(.2,40,28),new THREE.MeshLambertMaterial({map:encTex}));S.add(enc);

// Luz
S.add(new THREE.AmbientLight(0x404050,.55));
const sun=new THREE.DirectionalLight(0xfff2dc,1.7);sun.position.set(-40,12,30);S.add(sun);

// Cámara orbital propia
const cam={th:.6,ph:1.35,r:20,tr:20,tgt:new THREE.Vector3(),follow:()=>new THREE.Vector3()};
const FOC={
saturn:{f:()=>new THREE.Vector3(),r:20,ph:1.35},
rings:{f:()=>{const v=new THREE.Vector3(5.6,0,0).applyAxisAngle(new THREE.Vector3(0,0,1),.47);return v;},r:5,ph:1.5},
titan:{f:()=>titan.position,r:2.2,ph:1.45},
enc:{f:()=>enc.position,r:.9,ph:1.45}};
let cur='saturn';
function go(k){cur=k;const f=FOC[k];cam.follow=f.f;cam.tr=f.r;cam.ph=f.ph;show(k);}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.k));
$('#zi').onclick=()=>cam.tr=Math.max(.5,cam.tr*.75);$('#zo').onclick=()=>cam.tr=Math.min(60,cam.tr/.75);

const el=R.domElement;let drag=null,moved=0;
el.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};moved=0;el.setPointerCapture(e.pointerId);});
el.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved+=Math.abs(dx)+Math.abs(dy);drag={x:e.clientX,y:e.clientY};cam.th-=dx*.006;cam.ph=Math.min(3,Math.max(.15,cam.ph-dy*.006));});
el.addEventListener('pointerup',e=>{drag=null;if(moved<5)pick(e);});
el.addEventListener('wheel',e=>{e.preventDefault();cam.tr=Math.min(60,Math.max(.5,cam.tr*Math.exp(e.deltaY*.0012)));},{passive:false});
const ray=new THREE.Raycaster(),m=new THREE.Vector2();
function pick(e){m.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(m,C);
const h=ray.intersectObjects([titan,enc,saturn,rings],false)[0];if(!h)return;
const k=h.object===titan?'titan':h.object===enc?'enc':h.object===rings?'rings':'saturn';go(k);}

addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();});

const clk=new THREE.Clock();let ta=1,ea=3;
function loop(){const dt=clk.getDelta();ta+=dt*.12;ea+=dt*.45;saturn.rotation.y+=dt*.15;
titan.position.set(Math.cos(ta)*14,Math.sin(ta*.7)*.9,Math.sin(ta)*14);
enc.position.set(Math.cos(ea)*8.4,0,Math.sin(ea)*8.4);titan.rotation.y+=dt*.1;enc.rotation.y+=dt*.1;
cam.r+=(cam.tr-cam.r)*Math.min(1,dt*3);cam.tgt.lerp(cam.follow(),Math.min(1,dt*3.5));
C.position.set(cam.tgt.x+cam.r*Math.sin(cam.ph)*Math.sin(cam.th),cam.tgt.y+cam.r*Math.cos(cam.ph),cam.tgt.z+cam.r*Math.sin(cam.ph)*Math.cos(cam.th));
C.lookAt(cam.tgt);R.render(S,C);requestAnimationFrame(loop);}
go('saturn');loop();
</script>
</body>
</html>
